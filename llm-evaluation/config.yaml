# LLM evaluation settings. Paths are relative to this file.

dataset_dir: ../dataset/blind        # de-leaked classes; see dataset/make_blind_dataset.py
labels_file: ../dataset/labels.csv
results_dir: results
trials: 3                            # repeated runs per file, to measure run-to-run variation

# Set `model` to the exact model ID you evaluate and report that ID in the thesis.
# Prices are USD per million tokens and are used only to compute cost from the
# token counts the API returns; fill them in from the vendor's price list on the
# day you run the evaluation.
providers:
  anthropic:
    enabled: true
    model: claude-opus-5-5
    effort: medium                   # thinking depth; this model does not accept temperature
    max_tokens: 16000
    prices: {input_per_mtok: 4.00, output_per_mtok: 20.00}

  openai:
    enabled: false                   # enable after setting model and OPENAI_API_KEY
    model: null
    temperature: null                # leave null for reasoning models, which reject it
    max_tokens: 16000
    prices: {input_per_mtok: null, output_per_mtok: null}

  gemini:
    enabled: false                   # enable after `pip install google-genai`, setting model and GEMINI_API_KEY
    model: null
    temperature: 0
    max_tokens: 16000
    prices: {input_per_mtok: null, output_per_mtok: null}
