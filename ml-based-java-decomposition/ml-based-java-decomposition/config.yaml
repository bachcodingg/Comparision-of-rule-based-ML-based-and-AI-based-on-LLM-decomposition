# ML pipeline configuration

data:
  sample_dir: "../../dataset/blind"     # de-leaked evaluation classes (see dataset/)
  processed_dir: "data/processed"

# SMOTE and PCA are off by default and are switched on from the command line:
#   python run_pipeline.py --demo --smote --pca
# Model hyperparameters, the 80/20 split, the 5-fold cross-validation and the
# seed (42) are set in src/models/ml_classifier.py.

output:
  results_dir: "results"
  models_dir: "results/models"

logging:
  level: "INFO"
  file: "logs/ml_analysis.log"
